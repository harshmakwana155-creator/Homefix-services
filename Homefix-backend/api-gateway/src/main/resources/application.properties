server.port=8080

spring.application.name=api-gateway

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/**

spring.cloud.gateway.routes[2].id=service-service
spring.cloud.gateway.routes[2].uri=lb://SERVICE-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/services/**,/categories/**

spring.cloud.gateway.routes[3].id=provider-service
spring.cloud.gateway.routes[3].uri=lb://PROVIDER-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/providers/**

spring.cloud.gateway.routes[4].id=booking-service
spring.cloud.gateway.routes[4].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/bookings/**

spring.cloud.gateway.routes[5].id=payment-service
spring.cloud.gateway.routes[5].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/payments/**

spring.cloud.gateway.routes[6].id=notification-service
spring.cloud.gateway.routes[6].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/notifications/**

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
